name: Installateur Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests Rust
        run: cargo test -p cineplan-core -p cineplan-database
      - name: Dépendances de l'interface
        working-directory: apps/desktop
        run: npm install
      - name: Icônes de l'application
        working-directory: apps/desktop
        run: npm run tauri icon app-icon.png
      - name: Construction de l'installateur
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles nsis
      - name: Conserver l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: CinePlan-installateur
          path: target/release/bundle/nsis/*.exe
      - name: Joindre à la Release (étiquettes v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
